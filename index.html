<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Archivos - CSV a JSON</title>
    <link rel="stylesheet" href="inv.css">
</head>

<body>

    <div class="contenedor">

        <header>
            <h1>Conversor de Archivos</h1>
            <p>Conversión de archivos CSV a JSON</p>
        </header>

        <main>

            <section class="carga">
                <h2>1. Seleccionar archivo CSV</h2>

                <input
                    type="file"
                    id="archivoCSV"
                    accept=".csv,text/csv"
                >

                <p id="nombreArchivo">Ningún archivo seleccionado</p>
            </section>


            <section class="acciones">
                <h2>2. Convertir archivo</h2>

                <button id="convertirBtn" disabled>
                    Convertir CSV → JSON
                </button>
            </section>


            <section class="resultado">
                <h2>3. Resultado</h2>

                <pre id="resultadoJSON">Aquí aparecerá el JSON generado...</pre>

                <button id="descargarBtn" disabled>
                    Descargar JSON
                </button>
            </section>

        </main>

        <footer>
            <p>Mini Proyecto Archivos | CSV → JSON</p>
        </footer>

    </div>

    <script src="in.js"></script>

</body>
</html>
